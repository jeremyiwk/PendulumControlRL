[project]
name = "pendulumcontrol"
version = "0.1.0"
description = "Neural network control of an inverted pendulum, trained with swappable methods."
authors = [
    { name = "jeremyiwk", email = "jeremy@micromelody.net" }
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.8",
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "optax>=0.2.8",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pendulumcontrol"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
